name = "candle-pattern-monitor"
main = "./index.ts"
compatibility_date = "2025-01-01"

# Cron triggers — Cloudflare Workers fires these at exact second precision
[triggers]
crons = [
  # Pattern monitoring: every 15 minutes (pattern detection + alerts)
  "*/15 * * * *",
  # Hourly price report: at :05 past each hour
  "5 * * * *",
]

# Environment variables (set via wrangler secret put or dashboard)
[vars]
WATCHLIST_SYMBOLS = "BTCUSDT,NEARUSDT,ZECUSDT,PAXGUSDT"
INTERVAL = "15m"

# Secrets (set via `wrangler secret put`):
# - TELEGRAM_BOT_TOKEN = <your bot token>
# - TELEGRAM_CHAT_ID = <your chat id>
# - BINANCE_API_KEY = <optional, for higher rate limits>
