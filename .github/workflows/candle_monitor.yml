name: Candle Pattern Monitor

on:
  schedule:
    # Run every 15 minutes — primary monitoring (all patterns)
    - cron: '*/15 * * * *'
    # Run hourly — all patterns
    - cron: '0 * * * *'
    # Run every 4 hours — full scan
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated trading pairs'
        required: false
        default: 'BTCUSDT,NEARUSDT,ZECUSDT,PAXGUSDT'
      interval:
        description: 'Kline interval (15m, 1h, or 4h)'
        required: false
        default: '15m'
      focus:
        description: 'Pattern categories (empty = ALL patterns)'
        required: false
        default: ''

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run candle pattern monitor
        run: |
          # Use input values or fall back to defaults (cron runs get empty strings)
          SYMBOLS="${{ inputs.symbols }}"
          INTERVAL="${{ inputs.interval }}"
          FOCUS="${{ inputs.focus }}"

          # Apply defaults if inputs are empty (cron-triggered runs)
          if [ -z "$SYMBOLS" ]; then SYMBOLS="BTCUSDT,NEARUSDT,ZECUSDT,PAXGUSDT"; fi
          if [ -z "$INTERVAL" ]; then INTERVAL="15m"; fi

          python main.py --symbols "$SYMBOLS" --interval "$INTERVAL" --focus "$FOCUS"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
