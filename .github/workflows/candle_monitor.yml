name: Candle Pattern Monitor

on:
  schedule:
    # Pattern monitoring — every 15 minutes (GitHub fires within ~±15 min window)
    - cron: '*/15 * * * *'
    # Pattern monitoring — hourly
    - cron: '0 * * * *'
    # Pattern monitoring — every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated trading pairs'
        required: false
        default: 'BTCUSDT,NEARUSDT,ZECUSDT,PAXGUSDT'
      interval:
        description: 'Kline interval (15m, 1h, 4h)'
        required: false
        default: '15m'
      focus:
        description: 'Pattern categories (empty = ALL patterns)'
        required: false
        default: ''

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run candle pattern monitor
        env:
          SYMBOLS: ${{ inputs.symbols }}
          INTERVAL: ${{ inputs.interval }}
          FOCUS: ${{ inputs.focus }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
        run: |
          # Fallback defaults for cron-triggered runs (inputs come as empty strings)
          if [ -z "$SYMBOLS" ]; then SYMBOLS="BTCUSDT,NEARUSDT,ZECUSDT,PAXGUSDT"; fi
          if [ -z "$INTERVAL" ]; then INTERVAL="15m"; fi

          python main.py --symbols "$SYMBOLS" --interval "$INTERVAL" --focus "$FOCUS"