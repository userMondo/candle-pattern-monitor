name: Candle Pattern Monitor

# SCHEDULE DISABLED — migrated to Cloudflare Workers
# See src-worker/ for the always-on TypeScript implementation
# This workflow is kept for manual testing only

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated trading pairs'
        required: false
        default: 'BTCUSDT,NEARUSDT,ZECUSDT,PAXGUSDT'
      interval:
        description: 'Kline interval (15m, 1h, 4h)'
        required: false
        default: '15m'
      focus:
        description: 'Pattern categories (empty = ALL patterns)'
        required: false
        default: ''

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run candle pattern monitor
        env:
          SYMBOLS: ${{ inputs.symbols }}
          INTERVAL: ${{ inputs.interval }}
          FOCUS: ${{ inputs.focus }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
        run: |
          # Fallback defaults for manual runs
          if [ -z "$SYMBOLS" ]; then SYMBOLS="BTCUSDT,NEARUSDT,ZECUSDT,PAXGUSDT"; fi
          if [ -z "$INTERVAL" ]; then INTERVAL="15m"; fi

          PYTHONPATH=src python main.py --symbols "$SYMBOLS" --interval "$INTERVAL" --focus "$FOCUS"
