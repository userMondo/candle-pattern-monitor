# SCHEDULE DISABLED — migrated to Cloudflare Workers
# The hourly price report now runs as a Cloudflare Worker cron trigger
# See src-worker/ for the always-on TypeScript implementation
# This workflow is kept for manual testing only

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated trading pairs'
        required: false
        default: 'BTCUSDT,NEARUSDT,ZECUSDT,PAXGUSDT'

jobs:
  price_report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run price report
        env:
          SYMBOLS: ${{ inputs.symbols }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
        run: |
          if [ -z "$SYMBOLS" ]; then SYMBOLS="BTCUSDT,NEARUSDT,ZECUSDT,PAXGUSDT"; fi

          PYTHONPATH=src python main.py --symbols "$SYMBOLS" --interval "1h" --price-report
